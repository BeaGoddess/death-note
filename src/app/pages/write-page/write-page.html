<div class="write-page flex flex-col items-center justify-center min-h-screen px-4 py-10 gap-6">
  <h1 class="mb-6 font-death-note text-5xl tracking-wide text-white drop-shadow-2xl">Death Note</h1>

  @if (!hasWritten()) {
    <input
      type="text"
      placeholder="Name"
      [(ngModel)]="name"
      class="name-input mb-4 rounded-lg px-4 py-2 bg-shinigami-800 text-bone placeholder-shinigami-400 focus:outline-none focus:ring-2 focus:ring-shinigami-300 w-full max-w-xs shadow"
    />
    <button
      (click)="writeInNote()"
      [disabled]="!name.trim()"
      [class.text-shinigami-400]="!name.trim()"
      class="bg-shinigami-600 hover:bg-shinigami-700 text-bone font-semibold px-6 py-2 rounded-lg shadow transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-shinigami-400 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Write in the Death Note
    </button>
  } @else {
    <p
      class="result mb-6 text-lg text-center bg-shinigami-700 px-6 py-4 rounded-lg shadow max-w-md"
    >
      <strong class="text-shinigami-300 font-bold">{{ name }} </strong>
      <span class="italic">{{ causeOfDeath }}</span> in {{ countdown() }} seconds.
    </p>
    <button
      (click)="reset()"
      class="bg-shinigami-300 hover:bg-shinigami-400 text-shinigami-900 font-semibold px-6 py-2 rounded-lg shadow transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-shinigami-200"
    >
      Write another
    </button>
  }
</div>
