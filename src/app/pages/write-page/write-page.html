<div
  class="write-page flex min-h-[calc(100dvh-4rem)] flex-col items-center justify-center px-4 py-10"
>
  <div
    class="w-full max-w-lg rounded border border-[#0a0a0c] bg-notebook-spine p-2 pl-[18px] shadow-notebook-cover"
  >
    <div
      class="relative flex min-h-[30rem] flex-col overflow-hidden bg-paper bg-notebook px-8 pb-10 pl-[4.25rem] pt-8 text-ash-900 shadow-notebook-inset before:pointer-events-none before:absolute before:inset-y-0 before:left-[2.85rem] before:w-0.5 before:bg-blood-700/40 before:content-['']"
    >
      <h1 class="mb-8 text-5xl leading-[1.15] tracking-wide text-ash-900">Death Note</h1>

      @if (!hasWritten()) {
        <div class="flex flex-1 flex-col justify-between gap-8">
          <input
            id="victim-name"
            type="text"
            aria-label="Name"
            placeholder="Write a name..."
            [(ngModel)]="name"
            class="w-full appearance-none rounded-none border-0 border-b-2 border-ash-500/70 bg-transparent px-0 font-death-note text-3xl leading-tight text-ash-900 caret-ash-900 placeholder:text-ash-500/80 focus:border-blood-700 focus:outline-none focus:ring-0 autofill:shadow-[inset_0_0_0_1000px_var(--color-paper)] autofill:[-webkit-text-fill-color:var(--color-ash-900)]"
          />
          <button
            (click)="writeInNote()"
            [disabled]="!name.trim()"
            class="self-end rounded-sm bg-blood-800 px-5 py-2 font-semibold tracking-wide text-bone shadow-sm transition-colors duration-150 hover:bg-blood-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-blood-400 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-blood-800"
          >
            Write
          </button>
        </div>
      } @else {
        <div class="flex flex-1 flex-col justify-between gap-8">
          <div>
            <p class="font-death-note text-4xl tracking-wide text-ash-900">{{ name }}</p>
            <p class="italic text-ash-700">will die by {{ causeOfDeath }}</p>
            <p class="font-death-note text-2xl tracking-wide text-blood-700">
              in {{ countdown() | countdownFormat }}
            </p>
          </div>
          <button
            (click)="reset()"
            class="self-end rounded-sm border border-ash-700 px-5 py-2 font-semibold text-ash-900 transition-colors duration-150 hover:bg-ash-200/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-ash-500"
          >
            Write another
          </button>
        </div>
      }
    </div>
  </div>
</div>
