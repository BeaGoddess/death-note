<div class="mx-auto max-w-3xl px-4 py-10">
  <header class="mb-12 text-center">
    <p class="mb-3 font-death-note text-lg text-blood-800">How to use it</p>
    <h1 class="text-5xl tracking-wide text-blood-800">Rules</h1>
  </header>

  @if (rules.length > 0) {
    <ol class="m-0 flex list-none flex-col gap-8 p-0">
      @for (rule of rules; let i = $index; track rule) {
        <li class="flex items-start gap-5">
          <span
            class="w-12 shrink-0 select-none font-death-note text-3xl leading-none text-blood-600"
            >#{{ i + 1 }}</span
          >
          <p class="text-lg leading-relaxed text-ash-900">{{ rule }}</p>
        </li>
      }
    </ol>
  } @else {
    <p class="text-center text-base italic text-blood-400">No rules yet. Chaos reigns.</p>
  }
</div>
